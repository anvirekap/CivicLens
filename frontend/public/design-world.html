<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>CivicLens Spatial Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>
    <style>
      :root { --bg:#000; --fg:#fff; --pad-x:clamp(20px,6.95vw,120px) }
      * { box-sizing:border-box }
      html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; color:#fff; font-family:'Poppins',sans-serif; -webkit-font-smoothing:antialiased }
      .hero { position:relative; width:100%; height:100vh; height:100svh; min-height:520px; overflow:hidden; background:#000 }
      #scene { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none }
      #scene.dragging { cursor:grabbing }
      .ui { position:absolute; inset:0; pointer-events:none; z-index:2 }
      .ui a, .ui button { pointer-events:auto }
      .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0 }

      .nav { position:absolute; top:clamp(24px,4.7vh,40px); left:var(--pad-x); right:var(--pad-x); display:flex; align-items:center; justify-content:space-between }
      .logo { display:flex; align-items:center; gap:8px; color:#fff; text-decoration:none; font-size:15px; letter-spacing:-.01em }
      .logo-mark { width:20px; height:40px; background:#fff; border-radius:0 20px 20px 0 }
      .logo b { font-weight:700 }
      .logo span { font-weight:400 }
      .nav-links { display:flex; gap:clamp(20px,4.1vw,60px); list-style:none; margin:0; padding:0 }
      .nav-links a { color:#fff; text-decoration:none; font-size:15px; font-weight:500; position:relative }
      .nav-links a::after { content:''; position:absolute; left:0; right:0; bottom:-4px; height:1px; background:currentColor; transform:scaleX(0); transform-origin:right; transition:transform .35s ease }
      .nav-links a:hover::after { transform:scaleX(1); transform-origin:left }

      .arrows { position:absolute; top:18.9%; left:76.7%; display:flex; gap:32px; transform:translate(-19px,-50%) }
      .arrow { width:38px; height:38px; border-radius:50%; border:2.5px solid #fff; background:transparent; color:#fff; display:grid; place-items:center; padding:0; cursor:pointer; transition:background .25s,color .25s }
      .arrow svg { width:18px; height:18px }
      .arrow:hover { background:#fff; color:#000 }

      .dots { position:absolute; right:calc(var(--pad-x) - 7px); top:49.4%; transform:translateY(-50%); display:flex; flex-direction:column; gap:33px }
      .dot { width:14px; height:14px; border-radius:50%; border:2px solid #fff; background:#fff; padding:0; cursor:pointer; transition:background .25s }
      .dot.active { background:transparent }

      .tagline { position:absolute; left:var(--pad-x); bottom:clamp(40px,7.5vh,70px); margin:0; font-size:clamp(24px,2.65vw,44px); line-height:1.2; font-weight:300; letter-spacing:-.01em }
      .tagline strong { font-weight:700; display:block }

      .cta-row { position:absolute; left:45.6%; right:-1vw; top:88.7%; transform:translateY(-50%); display:flex; align-items:center }
      .cta { flex:none; padding:0 15px; height:48px; display:inline-flex; align-items:center; border:1.5px solid rgba(255,255,255,.85); border-radius:6px; background:rgba(0,0,0,.15); color:#fff; font-size:14px; font-weight:400; text-decoration:none; cursor:pointer; transition:background .25s,color .25s }
      .cta:hover { background:#fff; color:#000 }
      .cta-line { flex:1; height:1.5px; background:rgba(255,255,255,.8); min-width:40px }
      .count { flex:none; font-size:clamp(140px,19.8vw,360px); font-weight:400; line-height:1; letter-spacing:-.02em; color:transparent; -webkit-text-stroke:1.5px rgba(255,255,255,.9); transform:translateY(6%); user-select:none }

      .loader { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:12px; letter-spacing:.2em; text-transform:uppercase; opacity:.6; transition:opacity .6s }
      .loader.done { opacity:0; pointer-events:none }

      @media (max-width:900px), (max-aspect-ratio:1/1) {
        .arrows { left:auto; right:var(--pad-x); top:15%; transform:translateY(-50%); gap:14px }
        .tagline { bottom:clamp(150px,20vh,220px) }
        .cta-row { left:var(--pad-x); right:-3vw; top:auto; bottom:24px; transform:none }
        .count { font-size:clamp(120px,22vw,200px) }
      }
      @media (max-width:640px) {
        .nav-links { gap:16px }
        .nav-links a, .logo { font-size:13px }
        .dots { gap:20px; right:16px }
        .dot { width:10px; height:10px }
        .cta-row { right:-8vw }
        .count { font-size:120px }
      }
      @media (max-width:420px) { .nav-links li:nth-child(2) { display:none } }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition-duration:.01ms!important } }
    </style>
  </head>
  <body>
    <section class="hero" id="hero">
      <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>
      <div class="ui">
        <h1 class="sr-only">See Your City in a New Light</h1>
        <header class="nav">
          <a href="#" class="logo" aria-label="Return to CivicLens overview" data-civic-action="Overview"><i class="logo-mark" aria-hidden="true"></i><b>Civic</b><span>Lens</span></a>
          <ul class="nav-links"><li><a href="#" data-civic-action="Overview">Overview</a></li><li><a href="#" data-civic-action="3DLab">Live map</a></li><li><a href="#" data-civic-action="Community">Community</a></li></ul>
        </header>
        <div class="arrows" aria-label="Rotate the cube">
          <button class="arrow" id="prev" type="button" aria-label="Rotate left"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="arrow" id="next" type="button" aria-label="Rotate right"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <nav class="dots" aria-label="Slide selector"><button class="dot" type="button" aria-label="Slide 1"></button><button class="dot active" type="button" aria-label="Slide 2" aria-current="true"></button><button class="dot" type="button" aria-label="Slide 3"></button></nav>
        <p class="tagline">See your city<br>in a <strong>new light.</strong></p>
        <div class="cta-row"><a href="#" class="cta" data-civic-action="3DLab">Explore the live map</a><span class="cta-line"></span><span class="count" aria-hidden="true">07</span></div>
        <div class="loader" id="loader" role="status" aria-live="polite">Loading model</div>
      </div>
    </section>

    <script>
      document.addEventListener('click', event => {
        const link = event.target.closest('[data-civic-action]');
        if (!link) return;
        event.preventDefault();
        window.parent.postMessage({ type: 'civiclens:navigate', section: link.dataset.civicAction }, window.location.origin);
      });
    </script>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
      import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

      const MODEL_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';
      const canvas = document.querySelector('#scene');
      const loaderEl = document.querySelector('#loader');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
      renderer.setClearColor(0x000000, 1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

      const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
      camera.position.set(0, 0, 10);
      camera.lookAt(0, 0, 0);
      const scene = new THREE.Scene();
      const pivot = new THREE.Group();
      const spinner = new THREE.Group();
      scene.add(pivot);
      pivot.add(spinner);
      spinner.rotation.set(-0.42, 0.62, 0.18);

      const bgCanvas = document.createElement('canvas');
      const bgContext = bgCanvas.getContext('2d', { alpha:false });
      const bgTexture = new THREE.CanvasTexture(bgCanvas);
      bgTexture.colorSpace = THREE.SRGBColorSpace;
      bgTexture.minFilter = THREE.LinearFilter;
      bgTexture.magFilter = THREE.LinearFilter;
      bgTexture.generateMipmaps = false;
      const bgScene = new THREE.Scene();
      const bgMaterial = new THREE.ShaderMaterial({
        uniforms:{ uTex:{ value:bgTexture } },
        vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
        fragmentShader:`uniform sampler2D uTex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(uTex,vUv);\n#include <colorspace_fragment>\n}`,
        depthTest:false, depthWrite:false, toneMapped:false
      });
      const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), bgMaterial);
      bgQuad.frustumCulled = false;
      bgScene.add(bgQuad);

      const uniforms = () => ({
        uTexture:{value:null}, uResolution:{value:new THREE.Vector2(1,1)},
        uIorR:{value:1.15},uIorY:{value:1.16},uIorG:{value:1.18},uIorC:{value:1.22},uIorB:{value:1.22},uIorP:{value:1.22},
        uRefractPower:{value:.30},uChromatic:{value:.5},uSaturation:{value:1.08},uShininess:{value:90},uDiffuseness:{value:.02},uFresnelPower:{value:5},uLight:{value:new THREE.Vector3(-1,1,1)},uBackside:{value:0}
      });
      const vertexShader = `
        varying vec3 vNormal; varying vec3 vEye;
        void main(){ vec4 worldPos=modelMatrix*vec4(position,1.0); vec4 mvPos=viewMatrix*worldPos; gl_Position=projectionMatrix*mvPos; vNormal=normalize(normalMatrix*normal); vEye=normalize(mvPos.xyz); }
      `;
      const fragmentShader = `
        uniform sampler2D uTexture; uniform vec2 uResolution;
        uniform float uIorR,uIorY,uIorG,uIorC,uIorB,uIorP,uRefractPower,uChromatic,uSaturation,uShininess,uDiffuseness,uFresnelPower,uBackside;
        uniform vec3 uLight; varying vec3 vNormal; varying vec3 vEye;
        vec3 sampleBand(vec2 uv, vec3 direction, vec3 normal, float power, float slide, float ior, float k){
          vec3 ray=refract(direction, normal, 1.0/ior);
          return texture2D(uTexture, uv + ray.xy*(power+slide*k)*uChromatic).rgb;
        }
        float specular(vec3 light, float shininess, float diffuseness, vec3 n, vec3 viewDir){
          vec3 lightVec=normalize(-light); vec3 halfVec=normalize(lightVec+viewDir);
          return pow(max(dot(n,halfVec),0.0),shininess)+max(0.0,dot(n,lightVec))*diffuseness;
        }
        void main(){
          vec2 uv=gl_FragCoord.xy/uResolution; vec3 n=normalize(vNormal); if(uBackside>0.5)n=-n; vec3 eye=normalize(vEye);
          const float LOOP=16.0; vec3 color=vec3(0.0);
          for(int i=0;i<16;i++){
            float slide=float(i)/LOOP*.045;
            vec3 R=sampleBand(uv,eye,n,uRefractPower,slide,uIorR,1.0);
            vec3 Y=sampleBand(uv,eye,n,uRefractPower,slide,uIorY,1.0);
            vec3 G=sampleBand(uv,eye,n,uRefractPower,slide,uIorG,2.0);
            vec3 C=sampleBand(uv,eye,n,uRefractPower,slide,uIorC,2.5);
            vec3 B=sampleBand(uv,eye,n,uRefractPower,slide,uIorB,3.0);
            vec3 P=sampleBand(uv,eye,n,uRefractPower,slide,uIorP,1.0);
            float r=R.r*.5; float y=(Y.r*2.0+Y.g*2.0-Y.b)/6.0; float g=G.g*.5;
            float c=(C.g*2.0+C.b*2.0-C.r)/6.0; float b=B.b*.5; float p=(P.b*2.0+P.r*2.0-P.g)/6.0;
            float red=r+(2.0*p+2.0*y-c)/3.0; float green=g+(2.0*y+2.0*c-p)/3.0; float blue=b+(2.0*c+2.0*p-y)/3.0;
            color+=vec3(red,green,blue);
          }
          color/=LOOP; float lum=dot(color,vec3(.2125,.7154,.0721)); color=mix(vec3(lum),color,uSaturation);
          float spec=specular(uLight,uShininess,uDiffuseness,n,-eye)+.6*specular(vec3(1.0,1.0,-1.0),uShininess*.6,uDiffuseness*.5,n,-eye);
          color+=vec3(spec*(uBackside>.5?.35:1.0)); float f=pow(1.0+dot(eye,n),uFresnelPower); color=mix(color,vec3(1.0),f*(uBackside>.5?.25:.55));
          color+=vec3(.004,.005,.007); gl_FragColor=vec4(color,1.0);\n#include <colorspace_fragment>\n
        }
      `;
      const backUniforms=uniforms(); backUniforms.uRefractPower.value=.22; backUniforms.uBackside.value=1;
      const frontUniforms=uniforms();
      const backMat=new THREE.ShaderMaterial({ uniforms:backUniforms, vertexShader, fragmentShader, side:THREE.BackSide });
      const frontMat=new THREE.ShaderMaterial({ uniforms:frontUniforms, vertexShader, fragmentShader, side:THREE.FrontSide });
      const cube = new THREE.Mesh(new RoundedBoxGeometry(1,1,1,8,.12), frontMat);
      spinner.add(cube);
      let rtBack, rtFront, width=window.innerWidth, height=window.innerHeight, dpr=renderer.getPixelRatio();
      // Apply the second material to the same geometry in the back-face pass.
      const backCube = new THREE.Mesh(cube.geometry, backMat);
      spinner.add(backCube);
      backCube.visible=false;

      const disposeTarget = target => { if(target) target.dispose(); };
      function drawHeadline(){
        const W=window.innerWidth, H=window.innerHeight, px=Math.min(window.devicePixelRatio||1,2);
        bgCanvas.width=Math.max(1,Math.round(W*px)); bgCanvas.height=Math.max(1,Math.round(H*px));
        bgContext.setTransform(px,0,0,px,0,0); bgContext.fillStyle='#000'; bgContext.fillRect(0,0,W,H);
        const mobile=W<768 || W/H<1; const maxWidth=W*(mobile ? .9 : .5);
        let fs=Math.min(H*.21,W*(mobile?.21:.118)); bgContext.textAlign='center'; bgContext.textBaseline='alphabetic'; bgContext.font=`800 ${fs}px Poppins, sans-serif`;
        const lines=['Explore','New','Ideas']; const widest=Math.max(...lines.map(line=>bgContext.measureText(line).width));
        if(widest>maxWidth){ fs*=maxWidth/widest; bgContext.font=`800 ${fs}px Poppins, sans-serif`; }
        const cx=W*(mobile?.5:.505), cy=H*(mobile?.45:.468), gap=fs*1.07, cap=fs*.7;
        bgContext.fillStyle='#e9e9e9';
        lines.forEach((line,i)=>bgContext.fillText(line,cx,cy+cap/2+(i-1)*gap));
        bgTexture.needsUpdate=true;
      }
      function layout(){
        width=window.innerWidth; height=window.innerHeight; dpr=Math.min(window.devicePixelRatio||1,2);
        renderer.setPixelRatio(dpr); renderer.setSize(width,height,false); camera.aspect=width/height; camera.updateProjectionMatrix();
        const visH=2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*10, visW=visH*camera.aspect;
        const mobile=width<768 || width/height<1, sx=mobile ? .5 : .517, sy=mobile ? .45 : .488;
        pivot.position.set((sx-.5)*visW,(.5-sy)*visH,0);
        const px=Math.min(height*.44,width*(mobile ? .45 : .29)); const scale=(px/height)*visH; pivot.scale.setScalar(scale);
        drawHeadline();
        const size=renderer.getDrawingBufferSize(new THREE.Vector2());
        disposeTarget(rtBack); disposeTarget(rtFront);
        const options={type:THREE.HalfFloatType, minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, depthBuffer:true, stencilBuffer:false};
        rtBack=new THREE.WebGLRenderTarget(Math.max(1,size.x),Math.max(1,size.y),options);
        rtFront=new THREE.WebGLRenderTarget(Math.max(1,size.x),Math.max(1,size.y),options);
        backUniforms.uResolution.value.set(size.x,size.y); frontUniforms.uResolution.value.set(size.x,size.y);
        backUniforms.uTexture.value=rtBack.texture; frontUniforms.uTexture.value=rtFront.texture;
      }

      function centerNormalize(geometry){
        geometry.computeBoundingBox(); const box=geometry.boundingBox; const center=box.getCenter(new THREE.Vector3());
        geometry.translate(-center.x,-center.y,-center.z); geometry.computeBoundingBox();
        const size=geometry.boundingBox.getSize(new THREE.Vector3()); const largest=Math.max(size.x,size.y,size.z)||1; geometry.scale(1/largest,1/largest,1/largest); geometry.computeVertexNormals(); return geometry;
      }
      function fallbackModel(){
        const fallback=new RoundedBoxGeometry(1,1,1,8,.12); fallback.computeVertexNormals();
        cube.geometry.dispose(); backCube.geometry=fallback; cube.geometry=fallback; loaderEl.classList.add('done');
      }
      function loadModel(){
        new GLTFLoader().load(MODEL_URL, gltf=>{
          const root=gltf.scene; root.updateMatrixWorld(true); const parts=[];
          root.traverse(node=>{
            if(!node.isMesh || !node.geometry?.attributes?.position) return;
            let g=node.geometry.clone();
            for(const attr of ['uv','color','tangent']) if(g.getAttribute(attr)) g.deleteAttribute(attr);
            g.applyMatrix4(node.matrixWorld); g=mergeVertices(g,1e-4); g.computeVertexNormals(); parts.push(g);
          });
          if(!parts.length){ fallbackModel(); return; }
          const merged=mergeGeometries(parts,false);
          parts.forEach(g=>g.dispose());
          if(!merged){ fallbackModel(); return; }
          const normalized=centerNormalize(merged); cube.geometry.dispose(); cube.geometry=normalized; backCube.geometry=normalized;
          loaderEl.classList.add('done');
        }, undefined, ()=>fallbackModel());
      }

      const qY=new THREE.Quaternion(), qX=new THREE.Quaternion();
      const axisY=new THREE.Vector3(0,1,0), axisX=new THREE.Vector3(1,0,0);
      let dragging=false, lastX=0, lastY=0, lastPointerTime=0, velocityX=0, velocityY=0, releaseTime=performance.now(), spinRemaining=0;
      const clampDt=dt=>Math.min(Math.max(dt,0),.05);
      canvas.addEventListener('pointerdown',event=>{
        dragging=true; canvas.classList.add('dragging'); canvas.setPointerCapture(event.pointerId);
        lastX=event.clientX; lastY=event.clientY; lastPointerTime=performance.now(); velocityX=velocityY=0; spinRemaining=0;
      });
      canvas.addEventListener('pointermove',event=>{
        if(!dragging)return;
        const now=performance.now(), dt=Math.max((now-lastPointerTime)/1000,1/240), dx=(event.clientX-lastX)*.008, dy=(event.clientY-lastY)*.008;
        qY.setFromAxisAngle(axisY,dx); spinner.quaternion.premultiply(qY);
        qX.setFromAxisAngle(axisX,dy); spinner.quaternion.premultiply(qX);
        velocityX=dx/(dt*60); velocityY=dy/(dt*60); lastX=event.clientX; lastY=event.clientY; lastPointerTime=now;
      });
      function releaseDrag(){ if(!dragging)return; dragging=false; canvas.classList.remove('dragging'); releaseTime=performance.now(); }
      canvas.addEventListener('pointerup',releaseDrag); canvas.addEventListener('pointercancel',releaseDrag); canvas.addEventListener('lostpointercapture',releaseDrag);
      document.querySelector('#prev').addEventListener('click',()=>{velocityX=velocityY=0; releaseTime=performance.now(); spinRemaining-=Math.PI/2;});
      document.querySelector('#next').addEventListener('click',()=>{velocityX=velocityY=0; releaseTime=performance.now(); spinRemaining+=Math.PI/2;});
      document.querySelectorAll('.dot').forEach(dot=>dot.addEventListener('click',()=>{
        document.querySelectorAll('.dot').forEach(item=>{item.classList.remove('active');item.removeAttribute('aria-current');});
        dot.classList.add('active'); dot.setAttribute('aria-current','true');
      }));

      let previous=performance.now();
      function render(now){
        requestAnimationFrame(render); const dt=clampDt((now-previous)/1000); previous=now; const frames=dt*60;
        if(!dragging){
          if(Math.abs(spinRemaining)>.0005){
            const step=spinRemaining*Math.min(1,.09*frames); qY.setFromAxisAngle(axisY,step); spinner.quaternion.premultiply(qY); spinRemaining-=step;
          } else spinRemaining=0;
          if(Math.abs(velocityX)+Math.abs(velocityY)>.00001){
            qY.setFromAxisAngle(axisY,velocityX*frames); spinner.quaternion.premultiply(qY);
            qX.setFromAxisAngle(axisX,velocityY*frames); spinner.quaternion.premultiply(qX);
            const damp=Math.pow(.94,frames); velocityX*=damp; velocityY*=damp;
          }
          const idleBlend=THREE.MathUtils.smoothstep((now-releaseTime-600)/1000,0,1);
          if(idleBlend>0){ qY.setFromAxisAngle(axisY,.0035*frames*idleBlend); spinner.quaternion.premultiply(qY); qX.setFromAxisAngle(axisX,.0012*frames*idleBlend); spinner.quaternion.premultiply(qX); }
        }

        backCube.visible=true; cube.visible=false;
        renderer.setRenderTarget(rtBack); renderer.autoClear=true; renderer.render(bgScene,camera);
        renderer.setRenderTarget(rtFront); renderer.autoClear=true; renderer.render(bgScene,camera); renderer.autoClear=false; renderer.render(scene,camera);
        renderer.setRenderTarget(null); renderer.autoClear=true; renderer.render(bgScene,camera); renderer.clearDepth();
        renderer.autoClear=false; backCube.visible=false; cube.visible=true; renderer.render(scene,camera); renderer.autoClear=true;
      }

      layout();
      window.addEventListener('resize',layout,{passive:true});
      document.fonts?.addEventListener('loadingdone',drawHeadline);
      const fontsReady=Promise.all([document.fonts.load('800 100px Poppins'),document.fonts.ready]).catch(()=>{});
      await Promise.race([fontsReady,new Promise(resolve=>setTimeout(resolve,2500))]);
      layout(); loadModel(); requestAnimationFrame(render);
    </script>
  </body>
</html>
